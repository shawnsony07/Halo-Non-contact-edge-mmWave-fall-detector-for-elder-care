# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
mqtt:
  sensor:
    - name: "Radar Heart Rate"
      state_topic: "eldercare/radar/heart_rate"
      unit_of_measurement: "bpm"
      icon: "mdi:heart-pulse"
    - name: "Radar Breath Rate"
      state_topic: "eldercare/radar/breath_rate"
      unit_of_measurement: "bpm"
      icon: "mdi:lungs"
    - name: "Fall Probability"
      state_topic: "eldercare/radar/fall_probability"
      icon: "mdi:alert-circle"

rest_command:
  ntfy_notify:
    url: "https://ntfy.sh/halo-radar-9dfc55e71cdb"
    method: POST
    headers:
      Title: "{{ title }}"
      Priority: "urgent"
      Tags: "warning"
    payload: "{{ message }}"
    content_type: "text/plain"


